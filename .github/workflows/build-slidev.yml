name: Build and Deploy Slidev

on:
  push:
    branches:
      - main # или другая основная ветка

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: slidev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build HTML
        run: |
          npx slidev build --base / --out ../docs

      - name: Export PDF
        run: |
          npx playwright install chromium
          npx slidev export --output ../docs/presentation.pdf

      - name: Upload build as artifact for deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
